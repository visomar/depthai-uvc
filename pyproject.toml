[project]
name = "depthai-oak-test"
version = "0.1.0"
description = "DepthAI OAK test programs: device info and UVC webcam mode"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "depthai>=3.11,<4",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "pyvirtualcam>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
oak-info = "oak_info.main:main"
oak-uvc = "oak_uvc.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oak_info", "src/oak_uvc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "oak-app"
version = "0.1.0"
description = "Base project for building on top of a Luxonis OAK-D camera with DepthAI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "depthai>=3.11,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
oak-app = "oak_app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oak_app"]
